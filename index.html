<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #FDFBF7;
            --text-color: #3A3331;
            --accent-color: #9E8178;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* --- Элегантная секция приветствия --- */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            perspective: 1000px; /* Для 3D эффекта */
        }

        /* --- 3D и Пульс Сердца --- */
        .tilt-wrapper {
            transition: transform 0.1s ease-out;
            margin-bottom: 2rem;
        }

        .pulse-wrapper {
            animation: breathe 4s ease-in-out infinite;
            filter: drop-shadow(0 20px 30px rgba(158, 129, 120, 0.3));
        }

        .heart-mask {
            width: 320px;
            height: 320px;
            background-image: url('IMG_5927.png');
            background-size: cover;
            background-position: center;
            /* Идеальная маска сердца через SVG */
            -webkit-mask-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M462.3 62.6C407.5 15.9 326 24.3 275.7 76.2L256 96.5l-19.7-20.3C186.1 24.3 104.5 15.9 49.7 62.6c-62.8 53.6-66.1 149.8-9.9 207.9l193.5 199.8c12.5 12.9 32.8 12.9 45.3 0l193.5-199.8c56.3-58.1 53-154.3-9.8-207.9z'/%3E%3C/svg%3E");
            -webkit-mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M462.3 62.6C407.5 15.9 326 24.3 275.7 76.2L256 96.5l-19.7-20.3C186.1 24.3 104.5 15.9 49.7 62.6c-62.8 53.6-66.1 149.8-9.9 207.9l193.5 199.8c12.5 12.9 32.8 12.9 45.3 0l193.5-199.8c56.3-58.1 53-154.3-9.8-207.9z'/%3E%3C/svg%3E");
            mask-size: contain;
            mask-repeat: no-repeat;
            mask-position: center;
            cursor: pointer;
            transition: filter 0.5s ease;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }

        /* --- Типографика и Кнопки --- */
        .title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3rem;
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .subtitle {
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--accent-color);
            margin-bottom: 3rem;
            text-align: center;
        }

        .button-group {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
        }

        .btn {
            background: transparent;
            color: var(--text-color);
            border: 1px solid var(--text-color);
            padding: 12px 32px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s ease;
            text-decoration: none;
        }

        .btn:hover {
            background: var(--text-color);
            color: var(--bg-color);
        }

        /* --- Секция Галереи (Скрыта по умолчанию) --- */
        .gallery-section {
            opacity: 0;
            transform: translateY(50px);
            transition: all 1s ease;
            padding: 5rem 2rem;
            display: none; /* Изначально скрыто */
            flex-direction: column;
            align-items: center;
            background-color: #F8F5F1;
        }

        .gallery-section.visible {
            display: flex;
            opacity: 1;
            transform: translateY(0);
        }

        .gallery-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            font-weight: 400;
            margin-bottom: 4rem;
        }

        .gallery-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 3rem;
            justify-content: center;
            max-width: 1200px;
        }

        /* --- Элегантные рамки (Полароиды) --- */
        .frame {
            background: #FFFFFF;
            padding: 1.2rem 1.2rem 4rem 1.2rem;
            box-shadow: 0 15px 35px rgba(0,0,0,0.06);
            transition: all 0.5s ease;
            position: relative;
            cursor: pointer;
        }

        .frame:hover {
            transform: translateY(-15px);
            box-shadow: 0 25px 45px rgba(0,0,0,0.12);
        }

        .frame img {
            width: 280px;
            height: 380px;
            object-fit: cover;
            border-radius: 2px;
        }

        .frame-caption {
            position: absolute;
            bottom: 1.2rem;
            width: 100%;
            text-align: center;
            left: 0;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.2rem;
            color: #777;
        }

        /* Легкий поворот для небрежности */
        .frame:nth-child(1) { transform: rotate(-2deg); }
        .frame:nth-child(2) { transform: rotate(1deg); margin-top: 2rem; }
        .frame:nth-child(3) { transform: rotate(-1deg); }

        .frame:nth-child(1):hover,
        .frame:nth-child(2):hover,
        .frame:nth-child(3):hover {
            transform: translateY(-15px) rotate(0deg);
        }

        @media (max-width: 768px) {
            .heart-mask { width: 250px; height: 250px; }
            .title { font-size: 2.2rem; }
            .button-group { flex-direction: column; gap: 1rem; }
            .frame:nth-child(2) { margin-top: 0; }
        }
    </style>
</head>
<body>

    <!-- Главный экран -->
    <section class="hero">
        <!-- Обертки разделены: одна для 3D от мыши, другая для пульса -->
        <div class="tilt-wrapper" id="tilt-box">
            <div class="pulse-wrapper">
                <!-- Селфи в сердце -->
                <div class="heart-mask"></div>
            </div>
        </div>

        <h1 class="title">Для тебя</h1>
        <p class="subtitle">Сквозь объектив и время</p>

        <!-- Центрированные кнопки -->
        <div class="button-group">
            <button class="btn" id="showGalleryBtn">Наши моменты</button>
        </div>
    </section>

    <!-- Секция с фотографиями -->
    <section class="gallery-section" id="gallery">
        <h2 class="gallery-title">Запечатленные чувства</h2>
        
        <div class="gallery-grid">
            <!-- Профиль (сбоку) -->
            <div class="frame">
                <img src="IMG_6670.jpeg" alt="Твой профиль">
                <div class="frame-caption">Твоя красота</div>
            </div>

            <!-- Вместе перед зеркалом -->
            <div class="frame">
                <img src="IMG_6671.jpeg" alt="Мы перед зеркалом">
                <div class="frame-caption">Мы</div>
            </div>

            <!-- На улице -->
            <div class="frame">
                <img src="IMG_6672.jpeg" alt="Ты на улице">
                <div class="frame-caption">Момент</div>
            </div>
        </div>
    </section>

    <script>
        // 1. Плавный 3D-эффект для сердца при движении мыши (работает только на ПК)
        const tiltBox = document.getElementById('tilt-box');
        
        window.addEventListener('mousemove', (e) => {
            if (window.innerWidth > 768) {
                let x = (window.innerWidth / 2 - e.pageX) / 30; // Чувствительность оси X
                let y = (window.innerHeight / 2 - e.pageY) / 30; // Чувствительность оси Y
                tiltBox.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
            }
        });

        // Возврат сердца в исходное положение если курсор ушел с экрана
        window.addEventListener('mouseout', () => {
            tiltBox.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });

        // 2. Логика появления галереи по клику на центральную кнопку
        const showGalleryBtn = document.getElementById('showGalleryBtn');
        const gallery = document.getElementById('gallery');

        showGalleryBtn.addEventListener('click', () => {
            gallery.classList.add('visible');
            // Плавный скролл к галерее
            setTimeout(() => {
                gallery.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
            
            // Меняем текст кнопки после нажатия
            if(showGalleryBtn.innerText === 'НАШИ МОМЕНТЫ') {
                showGalleryBtn.innerText = 'СМОТРЕТЬ НИЖЕ ↓';
                showGalleryBtn.style.background = 'var(--text-color)';
                showGalleryBtn.style.color = 'var(--bg-color)';
            }
        });
    </script>
</body>
</html>
