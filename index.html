<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Романтичный розовый градиент */
            --bg-gradient: linear-gradient(135deg, #ffd1dc 0%, #ff9a9e 100%);
            --text-color: #5c1a2b; /* Темно-бордовый для контраста */
            --accent-color: #ff4d6d; /* Насыщенный розово-красный */
            --heart-glow: rgba(255, 77, 109, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            scroll-behavior: smooth;
            position: relative;
        }

        /* --- Фоновые сердечки --- */
        .bg-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-heart {
            position: absolute;
            bottom: -10%;
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.4);
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-110vh) scale(1.5) rotate(360deg); opacity: 0; }
        }

        /* --- Главный экран --- */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            position: relative;
            z-index: 1; /* Чтобы быть поверх фоновых сердец */
        }

        /* --- Портрет и Обволакивающее Сердце --- */
        .portrait-container {
            position: relative;
            width: 300px;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 3rem;
            cursor: pointer; /* Показываем, что сюда можно нажать */
        }

        /* Фотография девушки */
        .hero-portrait {
            width: 260px;
            height: 360px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(200, 50, 80, 0.3);
            z-index: 2;
            position: relative;
            border: 6px solid #fff;
            pointer-events: none; /* Чтобы клик проходил на контейнер */
        }

        /* Анимированное сердце на фоне */
        .enveloping-heart {
            position: absolute;
            width: 450px;
            height: 450px;
            z-index: 1;
            fill: none;
            stroke: var(--accent-color);
            stroke-width: 3;
            filter: drop-shadow(0 0 15px var(--heart-glow));
            animation: envelopePulse 3s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes envelopePulse {
            0% { transform: scale(0.9) rotate(-3deg); opacity: 0.7; stroke-width: 3; }
            50% { transform: scale(1.08) rotate(3deg); opacity: 1; stroke-width: 5; filter: drop-shadow(0 0 30px var(--heart-glow)); }
            100% { transform: scale(0.9) rotate(-3deg); opacity: 0.7; stroke-width: 3; }
        }

        /* --- Анимация вылетающих сердечек при клике --- */
        .click-heart {
            position: fixed; /* Фиксированное позиционирование для точных координат курсора */
            font-size: 24px;
            pointer-events: none;
            animation: flyOut 1s ease-out forwards;
            z-index: 100;
        }

        @keyframes flyOut {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.5); opacity: 0; }
        }

        /* --- Таймер --- */
        .timer-section {
            text-align: center;
            margin-bottom: 4rem;
            background: rgba(255, 255, 255, 0.6);
            padding: 2rem 4rem;
            border-radius: 25px;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(200, 50, 80, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.8);
        }

        .timer-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            font-style: italic;
            color: var(--text-color);
            margin-bottom: 0.5rem;
        }

        .infinity-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.5rem;
            font-weight: 600;
            color: var(--accent-color);
            margin-bottom: 1rem;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 77, 109, 0.3);
        }

        .timer-numbers {
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            gap: 20px;
            justify-content: center;
            color: var(--text-color);
        }
        
        .time-block {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-value {
            font-size: 1.8rem;
            font-weight: 600;
        }

        .time-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #8c4a5c;
            margin-top: 5px;
        }

        /* --- Кнопка и 100 слов --- */
        .btn-love {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 18px 45px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 40px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.4);
            margin-bottom: 2rem;
        }

        .btn-love:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 25px rgba(255, 77, 109, 0.6);
            background: #ff2a55;
        }

        .love-wall {
            max-width: 900px;
            text-align: center;
            line-height: 2.2;
            font-size: 1.2rem;
            font-family: 'Cormorant Garamond', serif;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 1.5s ease-in-out;
            padding: 0 2rem;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 20px;
        }

        .love-wall.open {
            max-height: 2500px;
            opacity: 1;
            margin-bottom: 5rem;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(200, 50, 80, 0.1);
        }

        .highlight-word {
            color: var(--accent-color);
            font-weight: 600;
            font-style: italic;
            font-size: 1.4rem;
            margin: 0 8px;
            text-shadow: 0 0 5px rgba(255, 77, 109, 0.2);
        }

        .standard-word {
            color: var(--text-color);
            margin: 0 5px;
        }

        /* --- Галерея --- */
        .gallery-section {
            padding: 5rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Легкий розово-белый фон для секции галереи */
            background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.7));
            position: relative;
            z-index: 1;
        }

        .gallery-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3rem;
            font-weight: 600;
            margin-bottom: 4rem;
            color: var(--text-color);
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.5);
        }

        .gallery-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 3rem;
            justify-content: center;
            max-width: 1200px;
        }

        .frame {
            background: #FFFFFF;
            padding: 1.2rem 1.2rem 4rem 1.2rem;
            box-shadow: 0 15px 35px rgba(150, 30, 60, 0.15);
            transition: all 0.5s ease;
            position: relative;
            border-radius: 4px;
        }

        .frame:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 25px 45px rgba(150, 30, 60, 0.25);
            z-index: 10;
        }

        .frame img {
            width: 280px;
            height: 380px;
            object-fit: cover;
            border-radius: 2px;
        }

        .frame-caption {
            position: absolute;
            bottom: 1.2rem;
            width: 100%;
            text-align: center;
            left: 0;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 600;
            font-size: 1.3rem;
            color: var(--accent-color);
        }

        .frame:nth-child(1) { transform: rotate(-3deg); }
        .frame:nth-child(2) { transform: rotate(2deg); margin-top: 2rem; }
        .frame:nth-child(3) { transform: rotate(-1deg); }

        @media (max-width: 768px) {
            .timer-section { padding: 1.5rem; }
            .infinity-text { font-size: 2.5rem; }
            .timer-numbers { gap: 10px; }
            .frame:nth-child(2) { margin-top: 0; }
        }
    </style>
</head>
<body>

    <!-- Фоновые сердечки -->
    <div class="bg-hearts" id="bgHearts"></div>

    <!-- Главный экран -->
    <section class="hero">
        
        <!-- Контейнер с фото и кликабельным эффектом -->
        <div class="portrait-container" id="heartContainer">
            <!-- SVG Сердце на заднем фоне -->
            <svg class="enveloping-heart" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
                <path d="M462.3 62.6C407.5 15.9 326 24.3 275.7 76.2L256 96.5l-19.7-20.3C186.1 24.3 104.5 15.9 49.7 62.6c-62.8 53.6-66.1 149.8-9.9 207.9l193.5 199.8c12.5 12.9 32.8 12.9 45.3 0l193.5-199.8c56.3-58.1 53-154.3-9.8-207.9z"/>
            </svg>
            <!-- Фото девушки -->
            <img src="IMG_5927.png" alt="Твой портрет" class="hero-portrait">
        </div>

        <!-- Таймер любви -->
        <div class="timer-section">
            <div class="timer-title">Я люблю тебя уже:</div>
            <div class="infinity-text">∞ БЕСКОНЕЧНО</div>
            <div class="timer-numbers" id="timer">
                <div class="time-block"><span class="time-value">∞</span><span class="time-label">Дней</span></div>
                <span class="time-value">:</span>
                <div class="time-block"><span class="time-value" id="hours">00</span><span class="time-label">Часов</span></div>
                <span class="time-value">:</span>
                <div class="time-block"><span class="time-value" id="minutes">00</span><span class="time-label">Минут</span></div>
                <span class="time-value">:</span>
                <div class="time-block"><span class="time-value" id="seconds">00</span><span class="time-label">Секунд</span></div>
            </div>
        </div>

        <!-- Кнопка 100 признаний -->
        <button class="btn-love" id="loveBtn">Узнать, что я чувствую</button>

        <!-- Стена признаний -->
        <div class="love-wall" id="loveWall"></div>

    </section>

    <!-- Секция с фотографиями -->
    <section class="gallery-section" id="gallery">
        <h2 class="gallery-title">Наши лучшие моменты 🩷</h2>
        
        <div class="gallery-grid">
            <!-- Профиль (сбоку) -->
            <div class="frame">
                <img src="IMG_6670.jpeg" alt="Твой профиль">
                <div class="frame-caption">Мой идеал</div>
            </div>

            <!-- Вместе перед зеркалом -->
            <div class="frame">
                <img src="IMG_6671.jpeg" alt="Мы перед зеркалом">
                <div class="frame-caption">Самые счастливые</div>
            </div>

            <!-- На улице -->
            <div class="frame">
                <img src="IMG_6672.jpeg" alt="Ты на улице">
                <div class="frame-caption">Мое всё</div>
            </div>
        </div>
    </section>

    <script>
        // --- 1. Генерация фоновых летящих сердечек ---
        const bgHeartsContainer = document.getElementById('bgHearts');
        const heartEmojis = ['🩷', '💖', '💗', '💓', '💕'];
        
        function createBgHeart() {
            const heart = document.createElement('div');
            heart.classList.add('bg-heart');
            heart.innerText = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            
            // Случайная позиция по горизонтали, размер и скорость
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 10 + 10) + 's'; // От 10 до 20 секунд
            heart.style.fontSize = (Math.random() * 1.5 + 0.5) + 'rem'; // Разный размер
            
            bgHeartsContainer.appendChild(heart);
            
            // Удаляем сердечко после завершения анимации, чтобы не засорять память
            setTimeout(() => {
                heart.remove();
            }, 20000);
        }

        // Создаем сердечки каждые 400мс
        setInterval(createBgHeart, 400);

        // --- 2. Интерактивные сердечки при клике на портрет ---
        const heartContainer = document.getElementById('heartContainer');

        heartContainer.addEventListener('click', (e) => {
            // Создаем от 8 до 15 сердечек за один клик
            const count = Math.floor(Math.random() * 8) + 8;
            
            for (let i = 0; i < count; i++) {
                const heart = document.createElement('div');
                heart.classList.add('click-heart');
                heart.innerText = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
                
                // Устанавливаем координаты клика
                heart.style.left = e.clientX + 'px';
                heart.style.top = e.clientY + 'px';
                
                // Случайное направление разлета (от -150px до +150px)
                const tx = (Math.random() - 0.5) * 300 + 'px';
                const ty = (Math.random() - 0.5) * 300 + 'px';
                heart.style.setProperty('--tx', tx);
                heart.style.setProperty('--ty', ty);
                
                // Случайный поворот
                heart.style.transform = `rotate(${Math.random() * 360}deg)`;

                document.body.appendChild(heart);

                // Удаляем элемент после завершения анимации (1 сек)
                setTimeout(() => {
                    heart.remove();
                }, 1000);
            }
        });

        // --- 3. Настройка таймера (Только часы, минуты, секунды) ---
        // Дни теперь зафиксированы как ∞ в HTML.
        const startDate = new Date("2023-01-01T00:00:00").getTime();

        function updateTimer() {
            const now = new Date().getTime();
            const difference = now - startDate;

            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("hours").innerText = hours.toString().padStart(2, '0');
            document.getElementById("minutes").innerText = minutes.toString().padStart(2, '0');
            document.getElementById("seconds").innerText = seconds.toString().padStart(2, '0');
        }

        setInterval(updateTimer, 1000);
        updateTimer();

        // --- 4. Генерация 100 признаний с комплиментами ---
        const loveBtn = document.getElementById('loveBtn');
        const loveWall = document.getElementById('loveWall');

        const compliments = [
            "Ты самая красивая", "Моя вселенная", "Моя нежность", 
            "Ты потрясающая", "Мой лучик света", "Идеал", 
            "Смысл моей жизни", "Ты невероятная", "Самая заботливая", 
            "Мое вдохновение", "Лучшее, что со мной случалось", "Мой ангел",
            "Моя радость", "Самая прекрасная девушка на свете"
        ];

        function generateLoveText() {
            let htmlContent = "";
            let compIndex = 0;

            for (let i = 1; i <= 100; i++) {
                htmlContent += `<span class="standard-word">Я тебя люблю.</span> `;
                
                if (i % 4 === 0) {
                    htmlContent += `<span class="highlight-word"> ${compliments[compIndex]}! 🩷 </span>`;
                    compIndex = (compIndex + 1) % compliments.length;
                }
            }
            return htmlContent;
        }

        loveBtn.addEventListener('click', () => {
            if (!loveWall.classList.contains('open')) {
                loveWall.innerHTML = generateLoveText();
                loveWall.classList.add('open');
                loveBtn.innerText = "Закрыть";
                
                setTimeout(() => {
                    loveWall.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 300);
            } else {
                loveWall.classList.remove('open');
                loveBtn.innerText = "Узнать, что я чувствую";
            }
        });
    </script>
</body>
</html>
